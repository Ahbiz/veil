appId: xyz.veil.wallet
---
# Reach the dashboard from a wiped install.
#
# Send and Receive are full-screen flows with a back chevron, not tabs. The
# tab bar is Wallet / Earn / Swap / Agent / Settings, and it is not on those
# screens. `veil://dashboard` is a registered link, so it mounts the tab
# directly. The first visit also raises the tutorial, which covers the screen
# until Skip is pressed.
- openLink: "veil://dashboard"
- extendedWaitUntil:
    visible:
      id: "tutorial-overlay"
    timeout: 20000
- runFlow: skip-tutorial.yaml
- extendedWaitUntil:
    visible:
      id: "dashboard-screen"
    timeout: 20000
