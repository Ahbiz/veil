appId: xyz.veil.wallet
name: Receive
tags:
  - core
  - receive
---
# Covers the receive path the web wallet exposes at /receive: an address the
# payer can act on, a SEP-7 QR built from it, and the two ways to hand it over.
- runFlow: ../subflows/launch-fresh.yaml

- openLink: "veil://receive"
- extendedWaitUntil:
    visible:
      id: "receive-screen"
    timeout: 20000
- assertVisible:
    id: "receive-address"
- assertVisible: "Use this for most senders & exchanges"

# A wiped install has no address yet, so Copy does not report "Copied".
# The buttons are still the hand-off controls, and they have to be on screen.
- assertVisible:
    id: "receive-copy"
- assertVisible:
    id: "receive-share"

# Leave and come back. A cold veil://receive is pushed on top of welcome, so
# Back returns there. The dashboard link is what mounts the tab, and opening
# receive again must still land on this screen.
- openLink: "veil://dashboard"
- extendedWaitUntil:
    visible:
      id: "tutorial-overlay"
    timeout: 20000
- runFlow: ../subflows/skip-tutorial.yaml
- extendedWaitUntil:
    visible:
      id: "dashboard-screen"
    timeout: 20000
- openLink: "veil://receive"
- extendedWaitUntil:
    visible:
      id: "receive-screen"
    timeout: 20000
- assertVisible:
    id: "receive-address"

# A requested amount arrives as a query parameter on the link. The screen does
# not render it yet (it builds a destination-only SEP-7 URI), so this asserts
# the routing only: the link must not be dropped or land somewhere else.
- stopApp
- openLink: "veil://receive?amount=42&asset=XLM"
- extendedWaitUntil:
    visible:
      id: "receive-screen"
    timeout: 30000
- assertVisible:
    id: "receive-address"
