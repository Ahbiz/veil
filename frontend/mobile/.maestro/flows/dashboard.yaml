appId: xyz.veil.wallet
name: Dashboard and first-run tutorial
tags:
  - core
  - onboarding
---
# The first-run tutorial (backlog #27) is the mobile equivalent of the overlay
# the web suite has to pre-seed past, and the dashboard is the only screen that
# mounts it. This flow is where that skip is actually exercised rather than
# silently no-op'd, and it covers the quick actions the dashboard routes through.
- runFlow: ../subflows/launch-fresh.yaml
- runFlow: ../subflows/open-dashboard.yaml

# Dismissed once, it stays dismissed: `veil_seen_tutorial` is persisted, so a
# return visit must not put the overlay back in the way.
- assertNotVisible:
    id: "tutorial-overlay"

# Send and Receive are registered links. The balance card's buttons stay on
# the loading skeleton until a wallet has a balance, so a wiped install
# reaches those screens by link, not by a quick-action id.
- openLink: "veil://send"
- extendedWaitUntil:
    visible:
      id: "send-screen"
    timeout: 20000

- openLink: "veil://dashboard"
- extendedWaitUntil:
    visible:
      id: "dashboard-screen"
    timeout: 20000
- assertNotVisible:
    id: "tutorial-overlay"

- openLink: "veil://receive"
- extendedWaitUntil:
    visible:
      id: "receive-screen"
    timeout: 20000
